<text x="1280" y="740" class="small"><tspan x="1280" dy="0">Scan any coupon</tspan><tspan x="1280" dy="31">Switch freely between views</tspan></text>
<path class="branch" d="M1518 714 C1576.24 714, 1571.76 645, 1630 645"/>
