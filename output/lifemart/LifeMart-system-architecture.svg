<svg xmlns="http://www.w3.org/2000/svg" width="2800" height="1660" viewBox="0 0 2800 1660" role="img" aria-labelledby="title desc">
<title id="title">LifeMart — Installation and Website Architecture</title>
<desc id="desc">Hardware and physical touchpoints connect to a kiosk website. Six items start unpriced. Visitors freely switch among three coupon valuation views, check out, and print an itemized receipt. Without coupons, or after removing them all, staff authorization returns the visitor to the original unpriced page and prints a product photograph without pricing details.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#827f79" stroke-width="1.1"/></marker></defs>
