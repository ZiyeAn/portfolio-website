<text x="690" y="278" class="small"><tspan x="690" dy="0">Reads item, coupon and employee codes</tspan></text>
<text x="690" y="346" class="bold"><tspan x="690" dy="0">Computer + display</tspan></text>
<text x="690" y="378" class="small"><tspan x="690" dy="0">Website presented in Chrome Kiosk mode</tspan></text>
<text x="690" y="446" class="bold"><tspan x="690" dy="0">Receipt printer</tspan></text>
<text x="690" y="478" class="small"><tspan x="690" dy="0">Prints either a valuation receipt or a product image</tspan></text>
<text x="690" y="546" class="bold"><tspan x="690" dy="0">Retail touchpoints</tspan></text>
<text x="690" y="578" class="small"><tspan x="690" dy="0">6 packaged items · 3 coupon types · employee code</tspan><tspan x="690" dy="31">Shelves, self-checkout counter, packaging &amp; signage</tspan></text>
