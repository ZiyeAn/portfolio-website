<text x="1638" y="854" class="small"><tspan x="1638" dy="0">Human: insurance value</tspan><tspan x="1638" dy="31">Animal: research value</tspan></text>
<text x="1638" y="990" class="bold"><tspan x="1638" dy="0">Coupon 3 · Layer 3</tspan></text>
<text x="1638" y="1024" class="small"><tspan x="1638" dy="0">Human: body resource value</tspan><tspan x="1638" dy="31">Animal: commodity value</tspan></text>
<text x="1628" y="577" class="note"><tspan x="1628" dy="0">Alternative views, not a required 1 → 2 → 3 sequence</tspan></text>
