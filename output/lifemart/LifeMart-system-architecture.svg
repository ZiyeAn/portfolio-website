<path class="highlight" d="M2400 1138 L2655 1135 L2652 1155 L2398 1153 Z"/>
<text x="2405" y="1152" class="bold"><tspan x="2405" dy="0">Print product image</tspan><tspan x="2405" dy="31">No pricing breakdown</tspan></text>
<text x="2015" y="1285" class="note"><tspan x="2015" dy="0">Refusing a price requires intervention:</tspan><tspan x="2015" dy="31">a familiar checkout obstacle becomes part of the critique.</tspan></text>
<path class="branch" d="M587 1285 C637.96 1285, 634.04 1281, 685 1281"/>
<path class="branch" d="M587 1285 C637.96 1285, 634.04 1402, 685 1402"/>
<text x="690" y="1288" class="bold"><tspan x="690" dy="0">Valuation receipt</tspan></text>
<text x="690" y="1320" class="small"><tspan x="690" dy="0">A life represented through a pricing system</tspan></text>
<text x="690" y="1409" class="bold"><tspan x="690" dy="0">Product photograph</tspan></text>
<text x="690" y="1441" class="small"><tspan x="690" dy="0">A life represented without a price</tspan></text>
<path class="branch" d="M501 746 C547.28 746, 543.72 1015, 590 1015"/>
<text x="595" y="1022" class="bold"><tspan x="595" dy="0">Interaction support</tspan></text>
<text x="595" y="1061" class="small"><tspan x="595" dy="0">Coupon eligibility checks</tspan><tspan x="595" dy="31">Item-switch and removal confirmations</tspan><tspan x="595" dy="31">1 / 2 / 3 exploration indicator</tspan><tspan x="595" dy="31">Pop-ups + voice prompts</tspan></text>
<path class="highlight" d="M1615 227 L1838 224 L1835 244 L1613 242 Z"/>
<text x="1620" y="241" class="bold"><tspan x="1620" dy="0">Input → website → output</tspan></text>
<text x="1620" y="287" class="node"><tspan x="1620" dy="0">Scanner reads a code → the kiosk website changes state.</tspan><tspan x="1620" dy="31">The website prepares the chosen output → the printer produces it.</tspan></text>
<text x="1620" y="377" class="small"><tspan x="1620" dy="0">Logical architecture: connection protocols and print drivers</tspan><tspan x="1620" dy="31">are not specified in the project documentation.</tspan></text>
<path class="accent" d="M 1618 315 C 1550 315, 1550 445, 1485 445"/>
<path d="M110 1510 H2690" stroke="#d4d0c9" stroke-width="1"/>
<text x="110" y="1553" class="small"><tspan x="110" dy="0">READING THE SYSTEM</tspan></text>
<text x="425" y="1553" class="small"><tspan x="425" dy="0">Branches show components and alternatives. Arrowheads show the website and print flow.</tspan></text>
<text x="110" y="1592" class="note"><tspan x="110" dy="0">The same retail interface supports two outcomes: accepting a valuation, or asking to leave without one.</tspan></text>
</svg>